[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biocheminsight-harness"
version = "0.1.0"
description = "Agent toolkit for BioChemInsight: patent and literature parsing driven from coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "mcp>=1.2,<2",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
biocheminsight-harness = "biocheminsight_harness.mcp_server:main"
biocheminsight-stats = "biocheminsight_harness.task_stats:main"

[tool.hatch.build.targets.wheel]
packages = ["src/biocheminsight_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
